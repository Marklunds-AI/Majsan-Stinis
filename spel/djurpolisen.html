<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Djurpolisen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ---------- Färger (samma glada stil som spelhörnan) ---------- */
        :root {
            --ink: #2a2150;
            --muted: #6b6296;
            --card: #ffffff;
            --gron: #34c77b;
            --gron-mork: #21995a;
            --bla: #4f8cff;
            --bla-mork: #2f63c9;
            --rosa: #ff5fa2;
            --shadow: rgba(52, 140, 90, .22);
        }

        /* ---------- Grund ---------- */
        * { box-sizing: border-box; }
        body {
            font-family: 'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif;
            color: var(--ink);
            background: linear-gradient(160deg, #e3fbef, #e2efff) fixed;
            background-color: #e3fbef;
            text-align: center;
            margin: 0;
            padding: 16px 16px 24px;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        h1 {
            margin: 4px 0 10px;
            font-size: clamp(30px, 6vw, 44px);
            font-weight: 700;
            color: var(--gron-mork);
            text-shadow: 0 3px 0 #ffc23d;
        }

        /* ---------- Poäng och svårighet ---------- */
        #ui {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 600;
        }
        .ui-box {
            background: var(--card);
            padding: 8px 16px;
            border-radius: 999px;
            box-shadow: 0 4px 12px var(--shadow);
        }
        .ui-box span { color: var(--gron-mork); font-weight: 700; }
        select {
            font: inherit;
            font-size: 16px;
            color: var(--ink);
            padding: 2px 6px;
            border: 2px solid #d6f3e3;
            border-radius: 999px;
            background: #f3fcf7;
        }

        /* ---------- Vägen ---------- */
        #gameContainer {
            position: relative;
            display: inline-block;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: calc(100vh - 290px);
            max-height: calc(100dvh - 290px);
            min-height: 300px;
            background-color: #4b5563;
            border: 6px solid #fff;
            border-radius: 24px;
            box-shadow: 0 14px 30px var(--shadow);
        }

        /* ---------- Krock-rutan ---------- */
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 300px;
            padding: 24px 22px;
            background: var(--card);
            border-radius: 26px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .35);
            z-index: 10;
            animation: popin .35s cubic-bezier(.34, 1.56, .64, 1);
        }
        @keyframes popin { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } }
        #gameOverScreen h2 {
            margin: 0 0 6px;
            font-size: 32px;
            color: var(--rosa);
        }
        #gameOverScreen p {
            margin: 8px 0;
            font-size: 18px;
            font-weight: 500;
        }
        #gameOverScreen p span { font-weight: 700; color: var(--gron-mork); }
        .restart-btn {
            margin-top: 14px;
            padding: 12px 28px;
            font: inherit;
            font-size: 20px;
            font-weight: 700;
            color: white;
            background: var(--gron);
            border: none;
            border-radius: 18px;
            box-shadow: 0 6px 0 var(--gron-mork);
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
        }
        .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--gron-mork); }
        .restart-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--gron-mork); }

        /* ---------- Pilknappar för surfplatta/mobil ---------- */
        #controls {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 16px;
        }
        .arrow-btn {
            width: 110px;
            height: 80px;
            font-size: 40px;
            color: white;
            background: var(--bla);
            border: none;
            border-radius: 22px;
            box-shadow: 0 7px 0 var(--bla-mork);
            cursor: pointer;
            touch-action: none;
            transition: transform .08s, box-shadow .08s;
        }
        .arrow-btn.down {
            transform: translateY(5px);
            box-shadow: 0 2px 0 var(--bla-mork);
        }
    </style>
</head>
<body>

    <h1>🚓 Djurpolisen 🚓</h1>
    
    <div id="ui">
        <div class="ui-box">Sträcka: <span id="scoreDisplay">0</span> m</div>
        <div class="ui-box">Tjuvar: <span id="thiefDisplay">0</span> st</div>
        <div class="ui-box">
            Svårighet:
            <select id="difficultySelect">
                <option value="0.7">Lätt</option>
                <option value="1" selected>Mellan</option>
                <option value="1.5">Svår</option>
            </select>
        </div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="gameOverScreen">
            <h2>Krock!</h2>
            <p>Du råkade köra på ett djur.</p>
            <p>Sträcka: <span id="finalScore">0</span> m</p>
            <p>Fångade tjuvar: <span id="finalThieves">0</span> st</p>
            <button class="restart-btn" onclick="resetGame()">Starta om</button>
        </div>
    </div>

    <div id="controls">
        <button class="arrow-btn" id="btnLeft" aria-label="Styr vänster">◀</button>
        <button class="arrow-btn" id="btnRight" aria-label="Styr höger">▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const difficultySelect = document.getElementById("difficultySelect");
        
        let distance = 0; 
        let thievesCaught = 0; // Ny variabel för tjuv-poäng
        let isGameOver = false;
        let animationId;
        
        let levelMultiplier = 1; 
        let milestonesPassed = 0;
        
        let car = { x: 175, y: 500, width: 50, height: 80, baseSpeed: 6 };
        
        let entities = [];
        let roadMarkers = []; 
        let spawnTimer = 0;

        const thieves = ["🦹‍♂️", "🥷", "🏃‍♂️💰"];
        const animals = ["🐶", "🐱", "🐰", "🐼", "🦊", "🦌"];

        const keys = { ArrowLeft: false, ArrowRight: false };
        window.addEventListener("keydown", (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener("keyup", (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Pilknappar: håll fingret (eller musen) på knappen för att styra
        function bindArrow(id, key) {
            const btn = document.getElementById(id);
            const press = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add("down"); };
            const release = () => { keys[key] = false; btn.classList.remove("down"); };
            btn.addEventListener("pointerdown", press);
            ["pointerup", "pointercancel", "pointerleave"].forEach(t => btn.addEventListener(t, release));
            btn.addEventListener("contextmenu", (e) => e.preventDefault());
        }
        bindArrow("btnLeft", "ArrowLeft");
        bindArrow("btnRight", "ArrowRight");

        function update() {
            if (isGameOver) return;

            let diffMultiplier = parseFloat(difficultySelect.value);
            let currentSpeedFactor = diffMultiplier * levelMultiplier;

            distance += 0.1 * currentSpeedFactor;

            let currentMilestone = Math.floor(distance / 500);
            if (currentMilestone > milestonesPassed) {
                milestonesPassed = currentMilestone;
                levelMultiplier += 0.2; 
                roadMarkers.push({ y: -40, height: 40 });
            }

            let actualCarSpeed = car.baseSpeed * currentSpeedFactor;
            if (keys.ArrowLeft && car.x > 0) car.x -= actualCarSpeed;
            if (keys.ArrowRight && car.x + car.width < canvas.width) car.x += actualCarSpeed;

            spawnTimer++;
            let spawnRate = Math.max(15, (70 / diffMultiplier) - Math.floor(distance / 50)); 
            
            if (spawnTimer > spawnRate) {
                spawnEntity();
                spawnTimer = 0;
            }

            for (let i = roadMarkers.length - 1; i >= 0; i--) {
                let m = roadMarkers[i];
                m.y += 5 * currentSpeedFactor; 
                if (m.y > canvas.height) {
                    roadMarkers.splice(i, 1);
                }
            }

            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                e.y += e.speed * currentSpeedFactor;

                if (checkCollision(car, e)) {
                    if (e.type === "thief") {
                        // Uppdaterar både bonussträcka och antal fångade tjuvar
                        distance += 50;
                        thievesCaught++;
                        entities.splice(i, 1);
                    } else if (e.type === "animal") {
                        triggerGameOver();
                        return; 
                    }
                }
                else if (e.y > canvas.height) {
                    entities.splice(i, 1);
                }
            }

            updateUI();
        }

        function spawnEntity() {
            let isThief = Math.random() < 0.4;
            let emoji = isThief ? thieves[Math.floor(Math.random() * thieves.length)] : animals[Math.floor(Math.random() * animals.length)];
            let type = isThief ? "thief" : "animal";
            let size = 40;
            
            // Standard: Slumpmässig position över HELA bredden (förhindrar kant-fusk)
            let spawnX = Math.random() * (canvas.width - size);

            // Smartsikte: 20% chans att figuren siktar direkt där polisbilen är just nu
            if (Math.random() < 0.20) {
                spawnX = car.x + (car.width / 2) - (size / 2);
                // Se till att figuren inte hamnar utanför skärmen om bilen är exakt vid kanten
                spawnX = Math.max(0, Math.min(canvas.width - size, spawnX));
            }

            entities.push({
                emoji: emoji,
                type: type,
                x: spawnX,
                y: -50,
                width: size,
                height: size,
                speed: isThief ? 4 + Math.random() * 2 : 3 + Math.random() * 1.5 
            });
        }

        function checkCollision(rect1, rect2) {
            let hitboxPadding = 10; 
            return (
                rect1.x < rect2.x + rect2.width - hitboxPadding &&
                rect1.x + rect1.width > rect2.x + hitboxPadding &&
                rect1.y < rect2.y + rect2.height - hitboxPadding &&
                rect1.y + rect1.height > rect2.y + hitboxPadding
            );
        }

        function draw() {
            ctx.fillStyle = "#4b5563";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#9ca3af";
            for(let i = 0; i < canvas.height; i += 60) {
                let offset = (distance * 20) % 60; 
                ctx.fillRect(canvas.width / 2 - 5, i + offset - 60, 10, 30);
            }

            for (let m of roadMarkers) {
                ctx.fillStyle = "#facc15"; 
                ctx.fillRect(0, m.y, canvas.width, m.height);
                
                ctx.fillStyle = "#000000";
                ctx.font = "bold 20px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("HASTIGHET ÖKAR!", canvas.width / 2, m.y + m.height / 2);
            }

            ctx.fillStyle = "#1d4ed8"; 
            ctx.fillRect(car.x, car.y, car.width, car.height);
            ctx.fillStyle = "#ffffff"; 
            ctx.fillRect(car.x + 10, car.y, 30, car.height);
            ctx.fillStyle = "#111827"; 
            ctx.fillRect(car.x + 5, car.y + 15, car.width - 10, 20);
            ctx.fillStyle = "#ef4444"; 
            ctx.fillRect(car.x + 10, car.y + 5, 10, 5);
            ctx.fillStyle = "#3b82f6"; 
            ctx.fillRect(car.x + 30, car.y + 5, 10, 5);

            ctx.font = "35px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            for (let e of entities) {
                ctx.fillText(e.emoji, e.x + e.width/2, e.y + e.height/2);
            }
        }

        function gameLoop() {
            if (!isGameOver) {
                update();
                draw();
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function updateUI() {
            document.getElementById("scoreDisplay").innerText = Math.floor(distance);
            document.getElementById("thiefDisplay").innerText = thievesCaught;
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById("gameOverScreen").style.display = "block";
            document.getElementById("finalScore").innerText = Math.floor(distance);
            document.getElementById("finalThieves").innerText = thievesCaught;
            difficultySelect.disabled = false; 
        }

        function resetGame() {
            distance = 0;
            thievesCaught = 0;
            isGameOver = false;
            entities = [];
            roadMarkers = [];
            milestonesPassed = 0;
            levelMultiplier = 1;
            car.x = 175; 
            
            document.getElementById("gameOverScreen").style.display = "none";
            difficultySelect.disabled = true; 
            
            updateUI();
            gameLoop(); 
        }

        difficultySelect.disabled = true; 
        updateUI();
        gameLoop();

    </script>
<script src="../tillbaka.js" data-pos="bottom-left"></script>
</body>
</html>
