<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Majsans recept</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧁</text></svg>">
<link rel="apple-touch-icon" href="ikoner/ikon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff0f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   FÄRGER – samma familj som spelhörnan, men varmare (bageri!)
   ========================================================= */
:root{
  --bg-1:#fff0f5;          /* bakgrund, överst */
  --bg-2:#fff6e5;          /* bakgrund, nederst */
  --ink:#3a2340;           /* text */
  --muted:#7a5f7e;         /* dämpad text */
  --card:#ffffff;
  --field:#ffffff;
  --ring:rgba(255,95,162,.35);
  --shadow:rgba(160,60,100,.16);
  --shadow-deep:rgba(160,60,100,.30);
  --slev-tom:#eadde6;      /* tom bakslev */

  --rosa:#ff5fa2;
  --gul:#ffc23d;
  --turkos:#1fcfc1;
  --lila:#8b5cf6;
  --orange:#ff8a3d;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-1:#2a1630; --bg-2:#241a14; --ink:#fbeff6; --muted:#d2b6cb;
    --card:#36203c; --field:#40284a; --ring:rgba(255,150,200,.45);
    --shadow:rgba(0,0,0,.35); --shadow-deep:rgba(0,0,0,.55); --slev-tom:#5a4360;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-1:#2a1630; --bg-2:#241a14; --ink:#fbeff6; --muted:#d2b6cb;
  --card:#36203c; --field:#40284a; --ring:rgba(255,150,200,.45);
  --shadow:rgba(0,0,0,.35); --shadow-deep:rgba(0,0,0,.55); --slev-tom:#5a4360;
  color-scheme:dark;
}

/* =========================================================
   GRUND
   ========================================================= */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink);
  background:linear-gradient(160deg,var(--bg-1),var(--bg-2)) fixed;
  background-color:var(--bg-1);
  font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Segoe UI',system-ui,sans-serif;
  overflow-x:hidden;
}
.blobs{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden}
.blobs span{position:absolute; border-radius:50%; filter:blur(60px); opacity:.4; animation:drift 18s ease-in-out infinite alternate}
.blobs span:nth-child(1){width:420px; height:420px; background:var(--rosa);   top:-120px; right:-100px}
.blobs span:nth-child(2){width:380px; height:380px; background:var(--gul);    top:40%;    left:-140px; animation-delay:-6s}
.blobs span:nth-child(3){width:340px; height:340px; background:var(--orange); bottom:-140px; right:20%; animation-delay:-12s}
@keyframes drift{to{transform:translate(-40px,30px) scale(1.1)}}

main{max-width:1120px; margin:0 auto; padding:32px 16px 40px}

/* =========================================================
   MENY: Spel / Recept
   ========================================================= */
.nav{display:flex; justify-content:center; margin-bottom:22px}
.nav div{display:flex; gap:6px; padding:6px; background:var(--field); border-radius:999px; box-shadow:0 6px 18px var(--shadow)}
.nav a{
  text-decoration:none; color:var(--ink); font-weight:600; font-size:18px;
  padding:10px 20px; border-radius:999px; transition:background .2s, transform .15s;
}
.nav a:hover{transform:translateY(-1px)}
.nav a[aria-current="page"]{background:var(--rosa); color:#fff}
.nav a:focus-visible{outline:none; box-shadow:0 0 0 5px var(--ring)}

/* =========================================================
   RUBRIK
   ========================================================= */
header{text-align:center; margin-bottom:30px}
.logo{display:inline-block; font-size:clamp(52px,10vw,76px); line-height:1; animation:bounce 2.8s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-10px) rotate(6deg)}}
h1{
  margin:10px 0 6px; font-weight:700; line-height:1.05; letter-spacing:-.01em;
  font-size:clamp(36px,7.5vw,68px); text-wrap:balance;
  background:linear-gradient(90deg,var(--orange),var(--rosa) 50%,var(--lila));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 rgba(255,194,61,.9)) drop-shadow(0 10px 18px var(--shadow));
}
header p{margin:0; font-size:clamp(18px,3vw,22px); color:var(--muted); font-weight:500}

/* =========================================================
   RECEPTKORT
   ========================================================= */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,340px)); justify-content:center; gap:26px}
.card{
  position:relative; display:flex; flex-direction:column; text-align:left;
  font:inherit; color:var(--ink); cursor:pointer; border:none;
  background:var(--card); border-radius:30px; padding:12px;
  box-shadow:0 10px 28px var(--shadow);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
  animation:popin .5s backwards;
}
@keyframes popin{from{opacity:0; transform:translateY(24px) scale(.96)}}
.card:hover{transform:translateY(-8px); box-shadow:0 22px 44px var(--shadow-deep)}
.card:focus-visible{outline:none; box-shadow:0 0 0 6px var(--ring),0 22px 44px var(--shadow-deep)}

.media{position:relative; aspect-ratio:4/3; border-radius:22px; overflow:hidden; background:#f6e9dc}
.media img{width:100%; height:100%; object-fit:cover; object-position:top; display:block; transition:transform .5s ease}
.card:hover .media img{transform:scale(1.06)}
.new{
  position:absolute; top:12px; right:12px;
  background:var(--rosa); color:#fff; font-size:14px; font-weight:700;
  padding:5px 12px; border-radius:999px; box-shadow:0 3px 10px rgba(0,0,0,.18);
  animation:wiggle 1.6s ease-in-out infinite;
}
@keyframes wiggle{0%,100%{transform:rotate(-4deg) scale(1)} 50%{transform:rotate(4deg) scale(1.08)}}
.amount{
  position:absolute; left:12px; bottom:12px;
  background:rgba(255,255,255,.92); color:#3a2340; font-size:14px; font-weight:600;
  padding:5px 12px; border-radius:999px; box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.body{display:flex; flex-direction:column; gap:10px; padding:16px 8px 6px; flex:1}
.body h2{margin:0; font-size:25px; font-weight:700; line-height:1.15}
.quote{margin:0; font-size:16px; color:var(--muted); font-style:italic}

/* Betyg med bakslevar */
.ratings{display:grid; gap:8px; margin-top:auto}
.rating{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 10px;
  background:color-mix(in srgb,var(--c) 12%,transparent); padding:8px 12px; border-radius:16px}
.rating .label{font-size:15px; font-weight:600; white-space:nowrap}
.rating .score{font-size:14px; font-weight:600; color:var(--muted); margin-left:4px; white-space:nowrap}
.slevar{display:flex; align-items:center; gap:2px}
.slev{position:relative; width:22px; height:28px; display:inline-block; flex:none}
.slev svg{position:absolute; inset:0; width:22px; height:28px}
.slev .bas{color:var(--slev-tom)}
.slev .fyll{color:var(--c); clip-path:inset(0 calc(100% - var(--fyll)) 0 0)}
.r-svar{--c:var(--orange)}
.r-smar{--c:var(--rosa)}

.open{
  margin-top:6px; display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--rosa); color:#fff; font-size:19px; font-weight:700;
  padding:12px 18px; border-radius:18px;
  box-shadow:0 6px 0 color-mix(in srgb,var(--rosa) 70%,#000);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
}
.card:hover .open{transform:translateY(-4px); box-shadow:0 10px 0 color-mix(in srgb,var(--rosa) 70%,#000)}

.empty{text-align:center; color:var(--muted); font-size:20px; padding:30px 0}

/* =========================================================
   STOR BILD (när man trycker på ett recept)
   ========================================================= */
.viewer{
  position:fixed; inset:0; z-index:20; display:none;
  background:rgba(30,15,35,.82); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:calc(70px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px));
}
.viewer.open-now{display:block; animation:fade .2s}
@keyframes fade{from{opacity:0}}
.viewer-inner{max-width:900px; margin:0 auto}
.viewer img{width:100%; height:auto; display:block; border-radius:18px; box-shadow:0 20px 50px rgba(0,0,0,.5); background:#fff}
.viewer-bar{
  position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; right:12px; z-index:21;
  display:flex; justify-content:space-between; align-items:center; gap:10px; max-width:900px; margin:0 auto;
}
.viewer-bar h2{margin:0; color:#fff; font-size:22px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.vbtn{
  flex:none; display:grid; place-items:center; height:48px; min-width:48px; padding:0 14px;
  border:none; border-radius:999px; cursor:pointer; text-decoration:none;
  font:inherit; font-size:17px; font-weight:600; color:#3a2340; background:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.vbtn:focus-visible{outline:none; box-shadow:0 0 0 5px var(--ring)}
.vbtns{display:flex; gap:8px}
.viewer .ratings{margin:14px 0 0; background:var(--card); padding:12px; border-radius:18px}

footer{text-align:center; color:var(--muted); font-size:16px; padding:40px 16px 24px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}
</style>
</head>
<body>

<div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>

<main>
  <nav class="nav" aria-label="Meny">
    <div>
      <a href="./">🎮 Spel</a>
      <a href="recept.html" aria-current="page">🧁 Majsans recept</a>
    </div>
  </nav>

  <header>
    <div class="logo" aria-hidden="true">🧁</div>
    <h1>Majsans recept</h1>
    <p>Bakat, smakat och betygsatt av Majsan själv!</p>
  </header>

  <div class="grid" id="lista"></div>
  <p class="empty" id="tom" hidden>Inga recept än – snart kommer det något gott! 🍪</p>
</main>

<footer>Gjort med 💜 av Majsan och Stinis</footer>

<!-- Stor bild -->
<div class="viewer" id="visare" role="dialog" aria-modal="true" aria-labelledby="visareTitel">
  <div class="viewer-bar">
    <h2 id="visareTitel"></h2>
    <div class="vbtns">
      <a class="vbtn" id="visareOppna" href="#" target="_blank" rel="noopener" aria-label="Öppna bilden i en ny flik">🔍</a>
      <button class="vbtn" id="visareStang" type="button" aria-label="Stäng">✕</button>
    </div>
  </div>
  <div class="viewer-inner">
    <img id="visareBild" alt="">
    <div class="ratings" id="visareBetyg"></div>
  </div>
</div>

<!-- Listan med recept finns i filen recept.js -->
<script src="recept.js"></script>
<script>
/* =========================================================
   BAKSLEVAR
   En bakslev ritas två gånger: en grå i botten och en färgad
   ovanpå som klipps, så att man kan visa t.ex. en halv slev.
   ========================================================= */
const SLEV_SVG = `<svg viewBox="0 0 24 30" aria-hidden="true"><g transform="rotate(14 12 15)">
  <rect x="10.2" y="13" width="3.6" height="16" rx="1.8" fill="currentColor" opacity=".75"/>
  <path d="M4 4.5Q4 1 7.5 1H16.5Q20 1 20 4.5V10Q20 15.5 14.5 15.5H9.5Q4 15.5 4 10Z" fill="currentColor"/>
  <path d="M7.5 4.5Q7.5 3.5 8.5 3.5H11" stroke="rgba(255,255,255,.65)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g></svg>`;

function slevar(betyg){
  const rad = document.createElement("span");
  rad.className = "slevar";
  for (let i = 0; i < 5; i++) {
    const fyll = Math.max(0, Math.min(1, betyg - i)) * 100;
    const s = document.createElement("span");
    s.className = "slev";
    s.style.setProperty("--fyll", fyll + "%");
    s.innerHTML = SLEV_SVG + SLEV_SVG;
    s.children[0].classList.add("bas");
    s.children[1].classList.add("fyll");
    rad.append(s);
  }
  return rad;
}

function visaBetyg(text, ikon, betyg, klass){
  const rad = el("div", "rating " + klass);
  rad.setAttribute("aria-label", `${text}: ${String(betyg).replace(".", ",")} av 5 bakslevar`);
  const vanster = el("span", "label", ikon + " " + text);
  const hoger = el("span");
  hoger.style.display = "flex"; hoger.style.alignItems = "center";
  hoger.append(slevar(betyg), el("span", "score", String(betyg).replace(".", ",") + "/5"));
  rad.append(vanster, hoger);
  return rad;
}

function betygsruta(r){
  const ruta = document.createDocumentFragment();
  if (r.svarighet != null) ruta.append(visaBetyg("Svårighet", "💪", r.svarighet, "r-svar"));
  if (r.smarrighet != null) ruta.append(visaBetyg("Smarrighet", "😋", r.smarrighet, "r-smar"));
  return ruta;
}

/* =========================================================
   HJÄLPFUNKTIONER
   ========================================================= */
function el(tag, klass, text){
  const e = document.createElement(tag);
  if (klass) e.className = klass;
  if (text) e.textContent = text;
  return e;
}
function arNytt(r){
  if (!r.tillagd) return false;
  const dagar = (Date.now() - new Date(r.tillagd).getTime()) / 86400000;
  return dagar >= 0 && dagar <= 30;
}

/* =========================================================
   BYGG RECEPTKORTEN
   ========================================================= */
const lista = document.getElementById("lista");
document.getElementById("tom").hidden = RECEPT.length > 0;

RECEPT.forEach((r, i) => {
  const kort = el("button", "card");
  kort.type = "button";
  kort.style.animationDelay = (i * 70) + "ms";

  const media = el("div", "media");
  const img = el("img");
  img.src = r.bild; img.alt = ""; img.loading = "lazy";
  media.append(img);
  if (r.antal) media.append(el("span", "amount", "🍪 " + r.antal));
  if (arNytt(r)) media.append(el("span", "new", "✨ Nytt!"));

  const kropp = el("div", "body");
  kropp.append(el("h2", "", r.namn));
  if (r.kommentar) kropp.append(el("p", "quote", "”" + r.kommentar + "” – Majsan"));
  const betyg = el("div", "ratings");
  betyg.append(betygsruta(r));
  kropp.append(betyg, el("span", "open", "Visa receptet 👩‍🍳"));

  kort.append(media, kropp);
  kort.addEventListener("click", () => oppna(r, kort));
  lista.append(kort);
});

/* =========================================================
   STOR BILD
   ========================================================= */
const visare = document.getElementById("visare");
let senastKort = null;

function oppna(r, kort){
  senastKort = kort;
  document.getElementById("visareTitel").textContent = r.namn;
  const bild = document.getElementById("visareBild");
  bild.src = r.bild;
  bild.alt = "Receptet " + r.namn;
  document.getElementById("visareOppna").href = r.bild;
  const b = document.getElementById("visareBetyg");
  b.replaceChildren(betygsruta(r));
  visare.scrollTop = 0;
  visare.classList.add("open-now");
  document.body.style.overflow = "hidden";
  document.getElementById("visareStang").focus();
}
function stang(){
  visare.classList.remove("open-now");
  document.body.style.overflow = "";
  if (senastKort) senastKort.focus();
}
document.getElementById("visareStang").addEventListener("click", stang);
visare.addEventListener("click", (e) => { if (e.target === visare || e.target.classList.contains("viewer-inner")) stang(); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && visare.classList.contains("open-now")) stang(); });
</script>
</body>
</html>
