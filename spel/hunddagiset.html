<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunddagiset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dcefff; --panel:#ffffff; --ink:#22324a; --muted:#5b6f8a; --line:#22324a;
  --accent:#ffcc33; --accent-ink:#22324a; --pink:#ff6f91; --soft:#eef6ff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13202f; --panel:#1d2f45; --ink:#eaf3fb; --muted:#a9bdd3; --line:#8fb3d6;
    --accent:#ffcc33; --accent-ink:#22324a; --pink:#ff86a3; --soft:#26405c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13202f; --panel:#1d2f45; --ink:#eaf3fb; --muted:#a9bdd3; --line:#8fb3d6;
  --accent:#ffcc33; --accent-ink:#22324a; --pink:#ff86a3; --soft:#26405c; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Segoe UI',system-ui,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column}

/* HUD */
#hud{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-size:18px;min-height:44px}
.chip b{font-weight:700}
.day{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:4px 12px;min-height:44px}
.day b{font-size:18px}
#roster{display:flex;gap:3px}
.rs{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--soft);opacity:.45}
.rs.here{opacity:1;background:var(--accent)}
.rs.gone{opacity:1;background:#7cc35a;color:#fff;font-weight:700}
.sp{flex:1}
.hb{display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:3px solid var(--line);border-radius:14px;padding:4px 12px;font-weight:600;font-size:17px;min-height:44px;box-shadow:0 3px 0 var(--line)}
.hb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
@media (max-width:720px){.hb span{display:none}.day b{font-size:16px}}

/* Stage & scene */
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#scene{position:absolute;left:0;top:0;width:1000px;height:625px;transform-origin:0 0;border-radius:22px;overflow:hidden;border:4px solid #22324a;background:#9fd977}
#scene svg.bg{position:absolute;inset:0;width:100%;height:100%}
#ents{position:absolute;inset:0}
#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--pink);color:#fff;font-weight:600;font-size:19px;padding:8px 18px;border-radius:999px;border:3px solid #22324a;z-index:40;max-width:92%;text-align:center;pointer-events:none;animation:hintpop .4s}
@keyframes hintpop{from{transform:translateX(-50%) scale(.8);opacity:0}}

/* Dogs */
.dog{position:absolute;left:0;top:0;width:0;height:0;cursor:pointer}
.dog .hit{position:absolute;left:-46px;top:-96px;width:92px;height:110px}
.dog .sprite{position:absolute;left:-40px;top:-78px;width:80px;height:80px;transform-origin:50% 100%;pointer-events:none}
.dog .flipper{width:100%;height:100%}
.dog .flipper.flip{transform:scaleX(-1)}
.dog svg{width:100%;height:100%;display:block;overflow:visible}
.tail{transform-origin:82px 60px;transform-box:view-box;animation:wag .45s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.dog.walking .flipper svg{animation:bob .26s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.dog.act-mat .flipper svg,.dog.act-vatten .flipper svg{animation:dip .45s ease-in-out infinite alternate}
@keyframes dip{to{transform:translateY(4px) rotate(-6deg)}}
.dog.act-lek .flipper svg{animation:zoom 1s ease-in-out infinite}
@keyframes zoom{0%{transform:translate(0,0)}25%{transform:translate(-22px,-14px)}50%{transform:translate(0,0)}75%{transform:translate(22px,-14px)}100%{transform:translate(0,0)}}
.dog.act-vila .flipper svg{transform:rotate(-8deg) scaleY(.88);transform-origin:50% 100%}
.dog .toy,.dog .zz{position:absolute;left:18px;top:-60px;font-size:24px;display:none;pointer-events:none}
.dog.act-lek .toy{display:block;animation:toss .5s ease-in-out infinite alternate}
@keyframes toss{to{transform:translate(-30px,-26px) rotate(180deg)}}
.dog.act-vila .zz{display:block;color:#fff;font-weight:700;text-shadow:0 2px 0 #22324a;animation:zz 1.6s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}50%{opacity:1}100%{opacity:0;transform:translate(14px,-18px)}}
.dog .ring{position:absolute;left:-36px;top:-12px;width:72px;height:24px;border-radius:50%;border:4px solid #ffcc33;box-shadow:0 0 0 3px #22324a;display:none;pointer-events:none}
.dog.sel .ring{display:block;animation:ringp .9s ease-in-out infinite alternate}
@keyframes ringp{to{transform:scale(1.12)}}
.dog .tag{position:absolute;left:-42px;top:8px;width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.dog .tag span{background:#fff;color:#22324a;border:2px solid #22324a;border-radius:999px;padding:0 8px;font-size:14px;font-weight:600;line-height:20px;white-space:nowrap}
.dog .tag i{display:block;width:52px;height:8px;border-radius:6px;background:#fff;border:2px solid #22324a;overflow:hidden}
.dog .tag i b{display:block;height:100%;background:#ff6f91;transition:width .3s}
.dog .bubble{position:absolute;left:-2px;width:54px;height:50px;background:#fff;border:3px solid #22324a;border-radius:50%;display:grid;place-items:center;font-size:27px;pointer-events:none;animation:pop .35s}
.dog .bubble::before,.dog .bubble::after{content:"";position:absolute;background:#fff;border:3px solid #22324a;border-radius:50%}
.dog .bubble::before{width:13px;height:13px;left:-2px;bottom:-9px}
.dog .bubble::after{width:7px;height:7px;left:-10px;bottom:-17px}
.dog .bubble.urgent{animation:wobble .6s ease-in-out infinite}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-9deg) scale(1.08)}75%{transform:rotate(9deg) scale(1.08)}}
.dog.bye{opacity:0;transition:opacity .6s}

/* Owners */
.owner{position:absolute;left:0;top:0;width:0;height:0;transition:opacity .6s;pointer-events:none}
.owner .osprite{position:absolute;left:-30px;top:-110px;width:60px;height:110px;animation:ownerIn .5s}
.owner svg{width:100%;height:100%;display:block}
@keyframes ownerIn{from{transform:translateX(40px);opacity:0}}
.owner .say{position:absolute;bottom:118px;right:-14px;width:200px;background:#fff;color:#22324a;border:3px solid #22324a;border-radius:16px;padding:7px 10px;font-size:15px;line-height:1.25;font-weight:500;animation:pop .3s;transform-origin:90% 100%}
.owner.bye{opacity:0}

.float{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:24px;color:#fff;text-shadow:0 2px 0 #22324a,2px 0 0 #22324a,-2px 0 0 #22324a,0 -2px 0 #22324a;animation:rise 1.4s forwards;z-index:3000;pointer-events:none;white-space:nowrap}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}

/* Action bar */
#actionbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--panel);border:4px solid var(--line);border-radius:22px;padding:10px 12px;z-index:45;width:min(560px,96%);box-shadow:0 5px 0 var(--line)}
.ab-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ab-av{width:52px;height:52px;flex:none}
.ab-av svg{width:100%;height:100%}
.ab-info{flex:1;min-width:0}
.ab-name{font-size:21px;font-weight:700}
.ab-msg{font-size:16px;color:var(--muted)}
.ab-joy{display:flex;align-items:center;gap:6px}
.ab-joy i{display:block;width:110px;height:12px;border-radius:8px;background:var(--soft);border:2px solid var(--line);overflow:hidden}
.ab-joy i b{display:block;height:100%;background:var(--pink)}
.ab-close{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--soft);font-size:18px;font-weight:700}
.ab-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ab-btns button{width:74px;height:74px;border-radius:18px;border:3px solid var(--line);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.ab-btns button span{font-size:30px;line-height:1}
.ab-btns button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ab-btns button:disabled{opacity:.4;box-shadow:none}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(20,32,50,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:100}
.card{background:var(--panel);color:var(--ink);border:4px solid var(--line);border-radius:26px;padding:22px 24px;max-width:640px;width:100%;max-height:100%;overflow:auto;box-shadow:0 6px 0 var(--line);animation:pop .25s}
.card h1{font-size:44px;margin:0;line-height:1}
.card h2{font-size:30px;margin:0 0 8px}
.card h3{font-size:20px;margin:18px 0 8px}
.card p{font-size:19px;line-height:1.4;margin:6px 0}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.btn{font-weight:600;font-size:20px;border:3px solid var(--line);border-radius:16px;padding:10px 20px;background:var(--accent);color:var(--accent-ink);min-height:54px;box-shadow:0 4px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.45}
.title{display:flex;align-items:center;gap:16px}
.title .logo{width:96px;height:96px;flex:none}
.title .logo svg{width:100%;height:100%}
.title p{color:var(--muted)}
.plist{display:grid;gap:8px}
.pbtn{display:flex;align-items:center;gap:12px;text-align:left;background:var(--soft);border:3px solid var(--line);border-radius:16px;padding:8px 14px;min-height:60px}
.pbtn .pav{font-size:34px}
.pbtn b{display:block;font-size:20px}
.pbtn small{font-size:15px;color:var(--muted)}
.newp{display:flex;flex-direction:column;gap:10px}
.newp input{font:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:var(--soft);color:var(--ink);-webkit-user-select:text;user-select:text}
.avs{display:flex;gap:6px;flex-wrap:wrap}
.av{width:52px;height:52px;border-radius:14px;border:3px solid transparent;background:var(--soft);font-size:28px}
.av.on{border-color:var(--line);background:var(--accent)}
.tips{display:grid;gap:8px;margin:10px 0}
.tip{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:8px 12px;font-size:18px}
.tip span{font-size:28px;width:36px;text-align:center}
.stats{display:flex;gap:12px;margin:12px 0}
.stats div{flex:1;background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:10px;text-align:center;font-size:18px}
.stats b{display:block;font-size:36px}

/* Shop */
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tabs button{flex:1;border:3px solid var(--line);border-radius:14px;background:var(--soft);padding:8px;font-weight:600;font-size:17px;min-height:48px}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.item{border:3px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--soft)}
.item .ic{font-size:36px;line-height:1.1}
.item .sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--line)}
.item b{font-size:18px}
.item small{font-size:14px;color:var(--muted);flex:1}
.item button{margin-top:6px;border:3px solid var(--line);border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;min-height:44px}
.item button:disabled{opacity:.45}
.item.own button{background:#7cc35a;color:#fff;opacity:1}

/* Gallery */
.gal{display:grid;gap:10px}
.gdog{display:flex;gap:12px;align-items:center;background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:8px 12px}
.gdog .gs{width:76px;height:76px;flex:none}
.gdog .gs svg{width:100%;height:100%}
.gdog b{font-size:20px}
.gdog p{font-size:15px;margin:2px 0;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips span{font-size:13px;border-radius:999px;padding:1px 8px;border:2px solid var(--line);background:var(--panel);opacity:.45}
.chips span.k{opacity:1;background:var(--accent);color:var(--accent-ink)}

/* Training */
.train{text-align:center}
.train .bigdog{width:120px;height:120px;margin:4px auto}
.train .bigdog svg{width:100%;height:100%;overflow:visible}
.status{font-size:21px;font-weight:600;min-height:30px;margin:4px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--panel)}
.dots i.f{background:var(--pink)}
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,120px));gap:12px;justify-content:center}
.pad{aspect-ratio:1;border-radius:26px;border:4px solid #22324a;font-size:46px;box-shadow:0 5px 0 #22324a;transition:transform .08s,filter .08s}
.pad.lit{filter:brightness(1.35) saturate(1.2);transform:scale(1.08);box-shadow:0 0 0 6px #fff,0 0 0 10px #22324a}
.pad:disabled{cursor:default}
.trick-sitt svg{animation:t-sitt .9s ease-in-out 2}
@keyframes t-sitt{50%{transform:scaleY(.82) translateY(10px)}}
.trick-tass svg{animation:t-tass .8s ease-in-out 2}
@keyframes t-tass{50%{transform:rotate(-14deg)}}
.trick-ligg svg{animation:t-ligg 1.2s ease-in-out 2}
@keyframes t-ligg{50%{transform:scaleY(.65) scaleX(1.12) translateY(22px)}}
.trick-snurra svg{animation:t-snurra 1s ease-in-out 2}
@keyframes t-snurra{to{transform:rotateY(360deg)}}
.trick-rulla svg{animation:t-rulla 1.1s ease-in-out 2}
@keyframes t-rulla{to{transform:rotate(360deg)}}
.cols{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.col{width:64px;height:64px;border-radius:50%;border:4px solid var(--line)}
.col.none{background:var(--soft);font-size:14px;font-weight:600}
/* Bygga moduler */
.plot{position:absolute;left:578px;top:32px;width:350px;height:566px;border:4px dashed #fff;border-radius:18px;background-image:linear-gradient(rgba(255,255,255,.28) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.28) 2px,transparent 2px);background-size:20px 20px;display:none;pointer-events:none}
#scene.building .plot{display:block}
#scene.building #ents{pointer-events:none}
#mods{position:absolute;inset:0;pointer-events:none}
.mod{position:absolute;transform:translate(-50%,-50%)}
.mod svg,#ghost svg{width:100%;height:100%;display:block;overflow:visible}
#scene.building .mod{pointer-events:auto;cursor:pointer}
.mod.lift{opacity:.3}
#ghost{position:absolute;transform:translate(-50%,-50%);pointer-events:none;opacity:.85;z-index:5000;animation:ghostp .8s ease-in-out infinite alternate}
#ghost::after{content:"";position:absolute;inset:-8px;border:4px dashed #7cc35a;border-radius:18px;background:rgba(124,195,90,.15)}
#ghost.bad::after{border-color:#e53935;background:rgba(229,57,53,.2)}
@keyframes ghostp{to{transform:translate(-50%,-50%) scale(1.03)}}
#buildbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--panel);border:4px solid var(--line);border-radius:22px;padding:10px 14px;z-index:46;width:min(560px,96%);box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;font-size:19px;font-weight:600}
.bb-btns{display:flex;gap:10px}
.dog .soap{position:absolute;left:-30px;top:-70px;font-size:26px;display:none;pointer-events:none}
.dog.act-tvatt .soap{display:block;animation:toss .6s ease-in-out infinite alternate}
.dog.act-tvatt .flipper svg{animation:shake .15s linear infinite alternate}
@keyframes shake{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.dog .mud{position:absolute;left:-28px;top:-44px;width:60px;height:34px;display:none;pointer-events:none;background:radial-gradient(circle at 18% 40%,#7a5230 0 6px,transparent 7px),radial-gradient(circle at 55% 65%,#7a5230 0 8px,transparent 9px),radial-gradient(circle at 85% 30%,#7a5230 0 5px,transparent 6px),radial-gradient(circle at 40% 20%,#8d6040 0 4px,transparent 5px)}
.dog.dirty .mud{display:block}
/* Agility */
.ag-track{position:relative;height:170px;background:linear-gradient(#cfeefe 0 58%,#9fd977 58%);border:4px solid var(--line);border-radius:20px;overflow:hidden;margin:10px 0;cursor:pointer}
.ag-h{position:absolute;bottom:26px;width:12px;height:48px;margin-left:-6px;background:repeating-linear-gradient(#e53935 0 8px,#fff 8px 16px);border:2px solid #22324a;border-radius:4px;transform-origin:50% 100%;transition:transform .3s}
.ag-h.ok{box-shadow:0 0 0 4px #7cc35a}
.ag-h.down{transform:rotate(80deg)}
.ag-flag{position:absolute;right:8px;bottom:34px;font-size:30px}
.ag-dog{position:absolute;bottom:12px;left:4%;width:86px;height:86px;margin-left:-43px}
.ag-dog .agf{width:100%;height:100%;transform:scaleX(-1)}
.ag-dog svg{width:100%;height:100%;overflow:visible}
.ag-dog.jump{animation:agj .6s ease-out}
@keyframes agj{50%{transform:translateY(-64px)}}
.ag-jump{min-width:220px;font-size:26px}
/* Minispel för aktiviteter */
.mg-help{font-size:19px}
.mg-area{margin:8px auto;max-width:460px;position:relative}
.big{font-size:24px;min-width:200px}
.recipe{display:flex;gap:10px;align-items:center;justify-content:center;font-size:19px;font-weight:600;background:var(--soft);border:3px solid var(--line);border-radius:14px;padding:6px 10px}
.recipe span{font-size:32px;opacity:.45;filter:grayscale(1)}
.recipe span.ok{opacity:1;filter:none}
.bowlwrap{display:flex;justify-content:center;margin:12px 0}
.bowl{width:180px;height:92px;border-radius:0 0 92px 92px;background:#ff6f91;border:4px solid #22324a;overflow:hidden;display:flex;justify-content:center}
.mix{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:30px;padding-top:8px}
.bowl.stir .mix{animation:stir .4s ease-in-out}
@keyframes stir{50%{transform:rotate(30deg) scale(.9)}}
.bowl.done .mix{filter:sepia(.5) saturate(1.4)}
.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ing{aspect-ratio:1;border-radius:16px;border:3px solid var(--line);background:var(--panel);font-size:32px;box-shadow:0 3px 0 var(--line)}
.ing:disabled{opacity:.3;box-shadow:none}
.ing.no{animation:no .35s}
@keyframes no{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:520px){.shelf{grid-template-columns:repeat(3,1fr)}}
.glasswrap{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:190px}
.jug{font-size:58px;align-self:flex-start;transition:transform .2s}
.jug.on{transform:rotate(-40deg)}
.wbowl{position:relative;width:110px;height:170px;border:4px solid #22324a;border-top:none;border-radius:0 0 22px 22px;background:#fff;overflow:hidden}
.wfill{position:absolute;left:0;right:0;bottom:0;height:0;background:#4fa3e0}
.wband{position:absolute;left:0;right:0;border-top:3px dashed #43a047;border-bottom:3px dashed #43a047;background:rgba(124,195,90,.3);z-index:1}
.wbowl.spill{animation:no .4s 2}
.pour{touch-action:none;-webkit-touch-callout:none}
.scrub{position:relative;width:250px;height:250px;margin:0 auto;touch-action:none;border-radius:24px;background:#cfeefe;border:4px solid var(--line);cursor:pointer;overflow:hidden}
.scrub .scdog{position:absolute;inset:20px;pointer-events:none}
.scrub .scdog svg{width:100%;height:100%}
.spot{position:absolute;width:44px;height:34px;margin:-17px 0 0 -22px;border-radius:50%;background:#7a5230;border:2px solid #5a3a1e;transition:opacity .2s,transform .2s;display:grid;place-items:center}
.spot.clean{background:none;border:none;font-size:26px}
.scrub.rinse::after{content:"💧 💧 💧";position:absolute;left:0;right:0;top:-20px;text-align:center;font-size:32px;animation:rain 1.1s linear forwards}
@keyframes rain{to{transform:translateY(260px);opacity:0}}
.field{position:relative;height:150px;background:#9fd977;border:4px solid var(--line);border-radius:20px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.45);border-left:3px dashed #fff;border-right:3px dashed #fff}
.needle{position:absolute;top:0;bottom:0;width:8px;margin-left:-4px;background:#ff6f91;border:2px solid #22324a;border-radius:4px}
.tdog{position:absolute;bottom:4px;width:72px;height:72px;margin-left:-36px}
.tdog svg{width:100%;height:100%;overflow:visible}
.tdog.catch{animation:agj .6s ease-out}
.tball{position:absolute;font-size:28px;margin-left:-14px}
.nap{position:relative;width:250px;height:200px;margin:0 auto;border-radius:24px;background:#ffc6d3;border:4px solid var(--line);cursor:pointer;display:grid;place-items:center;overflow:hidden}
.nap .ndog{width:150px;height:150px;transition:transform .5s;pointer-events:none}
.nap .ndog svg{width:100%;height:100%}
.nap.sleep .ndog{transform:rotate(-8deg) scaleY(.85)}
.calm{width:230px;height:18px;margin:10px auto;border-radius:10px;border:3px solid var(--line);background:var(--soft);overflow:hidden}
.calm i{display:block;height:100%;width:0;background:#b39ddb;transition:width .3s}
.pat{position:absolute;font-size:26px;animation:rise 1.2s forwards;pointer-events:none}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
}

let AC=null;
function tone(f,d=.15,type='sine',vol=.12,delay=0){
  if(!save.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}

  if(d.lastNeed&&Object.keys(w).length>1) delete w[d.lastNeed];
  let type=wpick(w);

  d.need={type,age:0}; d.lastNeed=type;

  if(type==='mat') target={x:FOOD.x+rand(-12,12),y:FOOD.y+rand(-4,8)};
  else if(type==='vatten') target={x:WATER.x+rand(-12,12),y:WATER.y+rand(-4,8)};

    const pool=modOf('pool');
    if(pool&&Math.random()<.5){d.atPool=true;target={x:pool.x+rand(-30,30),y:pool.y+rand(-4,16)}}

  }
  else if(type==='tvatt'){const m=modOf('tvatt');target={x:m.x+rand(-8,8),y:m.y+12}}
  else if(type==='vila'){
    const spots=restSpots();
    const used=G.dogs.filter(o=>o!==d&&o.bed!==null).map(o=>o.bed);
    const free=shuffle(spots.map((s,i)=>i).filter(i=>!used.includes(i)));
    const i=free.length?free[0]:Math.floor(Math.random()*spots.length);
    d.bed=i; d.sun=!!spots[i].sun; target={x:spots[i].x+rand(-6,6),y:spots[i].y};
  }
  d.state='go'; d.path=route(d,target);
  d.onArrive=()=>{
    d.state='act'; d.act=type; d.el.classList.add('act-'+type);
    d.busyT=type==='lek'?3.6:type==='vila'?4.6:type==='tvatt'?3.4:2.8;
  };
  deselect();
}
function finishAction(d){
  const type=d.act; d.el.classList.remove('act-'+type); d.act=null; d.bed=null;
  d.state='idle'; d.wanderIn=rand(1.5,3.5);
  const extra=boostFor(type)+(d.atPool||d.sun?8:0)+(d.miniBonus||0); d.atPool=false; d.sun=false; d.miniBonus=0;
  if(type==='tvatt'){d.dirty=false;d.el.classList.remove('dirty')}
  fulfill(d,type,extra);
  if(type==='lek'&&hasMod('tvatt')&&!d.dirty&&Math.random()<.45){
    d.dirty=true; d.el.classList.add('dirty');
    if(d.need){hideBubble(d);d.need=null}
    d.forceNeed='tvatt'; d.needIn=1.5;
  }
}
function callOwner(d){
  d.state='leave'; d.need=null; hideBubble(d);
  if(G.selected===d) deselect();
  const o=makeOwner('pick',`Hej ${d.def.name}! Dags att gå hem!`,d.r);
  d.path=route(d,GATE).concat([{x:OWNER.x-16,y:OWNER.y-4}]);
  d.onArrive=()=>pay(d,o);
}
function pay(d,o){
  const p=P();
  const tip=Math.round(d.joy/10)+decorCount();
  const kr=15+tip, st=d.joy>=75?3:d.joy>=45?2:1;
  p.money+=kr; p.stars+=st; G.earned+=kr; G.starsEarned+=st;
  if(d.def.regular) p.dogs[d.def.id].visits++;
  persist(); updateHUD();
  sayOwner(o,st===3?`Wow, så glad ${d.def.name} är! Tack! Här är ${kr} kr.`:`Tack för i dag! Här är ${kr} kr.`);
  float(o.x-40,o.y-150,`+${kr} kr`); setTimeout(()=>float(o.x-40,o.y-120,'⭐'.repeat(st)),300);
  sCoin();
  o.waiting=false; o.t=0;
  d.el.classList.add('bye'); setTimeout(()=>d.el.remove(),650);
  G.dogs.splice(G.dogs.indexOf(d),1);
  d.r.status='gone'; renderRoster();
}
function updateDog(d,dt){
  if(d.path.length){
    const tgt=d.path[0], dx=tgt.x-d.x, dy=tgt.y-d.y, dist=Math.hypot(dx,dy);
    const step=(d.def.size>1.1?125:150)*dt;
    if(Math.abs(dx)>2) d.face=dx>0?1:-1;
    if(dist<=step){
      d.x=tgt.x; d.y=tgt.y; d.path.shift();
      if(!d.path.length&&d.onArrive){const f=d.onArrive;d.onArrive=null;f()}
    }else{d.x+=dx/dist*step; d.y+=dy/dist*step}
  }
  if(!G.dogs.includes(d)) return;
  if(d.state==='act'){d.busyT-=dt; if(d.busyT<=0) finishAction(d)}
  if(d.state!=='leave'&&d.state!=='arrive'){
    if(!d.need){d.needIn-=dt; if(d.needIn<=0&&d.state==='idle') newNeed(d)}
    else d.need.age+=dt;
  }
  const decay=d.need&&d.need.age>6?.45:.12;
  if(d.state!=='leave') d.joy=Math.max(0,d.joy-decay*dt);
  if(d.state==='idle'&&!d.path.length){
    d.wanderIn-=dt;
    if(d.wanderIn<=0){d.path=route(d,randIn(region(d)==='house'?HOUSE:YARD));d.wanderIn=rand(3,7)}
  }
  if(d.state!=='arrive'&&d.state!=='leave') d.stay-=dt;
  if(d.stay<=0&&d.state==='idle') callOwner(d);
  renderDog(d);
}
function renderDog(d){
  const e=d.el;
  e.style.transform=`translate(${d.x}px,${d.y}px)`;
  e.style.zIndex=20+Math.round(d.y);
  e.classList.toggle('walking',d.path.length>0&&d.state!=='act');
  d.flipper.classList.toggle('flip',d.face>0);
  d.bar.style.width=Math.round(d.joy)+'%';
  if(d.need) d.bubble.classList.toggle('urgent',d.need.age>8);
}

let last=performance.now(), barT=0;
function update(dt){
  G.t+=dt;
  for(const r of G.roster){if(r.status==='wait'&&G.t>=r.at){r.status='here';dropOff(r);renderRoster()}}
  updateOwners(dt);
  for(const d of G.dogs.slice()) updateDog(d,dt);
  barT+=dt; if(barT>.2){barT=0;refreshBar()}
  if(G.hint===3){G.hintT+=dt;if(G.hintT>6){G.hint=0;setHint('')}}
  if(!G.ended&&G.roster.length&&G.roster.every(r=>r.status==='gone')&&!G.owners.length){G.ended=true;endDay()}
}
function tick(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(G.running&&!G.paused) update(dt);
  requestAnimationFrame(tick);
}

function lightPad(i){
  const b=modal.querySelector(`[data-pad="${i}"]`); if(!b) return;
  b.classList.add('lit'); tone(PADS[i].f,.32,'triangle',.14);
  setTimeout(()=>b.classList.remove('lit'),380);

function setDots(n){modal.querySelectorAll('#tDots i').forEach((x,i)=>x.classList.toggle('f',i<n))}
function playSeq(){
  if(!TR) return;
  const tk={}; TR.token=tk; TR.phase='show'; TR.pos=0; setDots(0); setPads(false);
  $('#tStatus').textContent='Titta noga…';
  TR.seq.forEach((p,i)=>setTimeout(()=>{if(TR&&TR.token===tk) lightPad(p)},i*750));
  setTimeout(()=>{if(TR&&TR.token===tk){TR.phase='input';setPads(true);$('#tStatus').textContent='Din tur! Tryck i samma ordning.'}},TR.seq.length*750+250);

function padPress(i){
  if(!TR||TR.phase!=='input') return;
  lightPad(i);
  if(TR.seq[TR.pos]===i){
    TR.pos++; setDots(TR.pos);
    if(TR.pos===TR.seq.length) trainSuccess();
  }else{
    TR.phase='wait'; setPads(false);
    $('#tStatus').textContent='Oj, nästan! Titta en gång till.';
    tone(200,.25,'sine',.1);
    const tk=TR.token; setTimeout(()=>{if(TR&&TR.token===tk) playSeq()},1200);
  }
}
function trainSuccess(){
  const {d,t}=TR; TR.phase='done'; setPads(false);

function miniMat(a,d,me){
  const recipe=shuffle(INGR.slice()).slice(0,3).map(x=>x.i), added=[];
  a.innerHTML=`<div class="recipe">Recept: ${recipe.map(r=>`<span data-r="${r}">${r}</span>`).join('')}</div>
    <div class="bowlwrap"><div class="bowl" id="mBowl"><div class="mix" id="mMix"></div></div></div>
    <div class="shelf" id="mShelf">${shuffle(INGR.slice()).map(x=>`<button class="ing" data-i="${x.i}" aria-label="${x.n}">${x.i}</button>`).join('')}</div>`;
  mgHelp('Lägg i det som står på receptet.');
  a.querySelectorAll('.ing').forEach(b=>b.onclick=()=>{
    if(!mgLive(me)) return; const i=b.dataset.i;
    if(recipe.includes(i)&&!added.includes(i)){
      added.push(i); b.disabled=true; a.querySelector(`[data-r="${i}"]`).classList.add('ok');
      $('#mMix').insertAdjacentHTML('beforeend',`<span>${i}</span>`); tone(520+added.length*120,.12,'triangle',.1); mgStatus('');
      if(added.length===recipe.length) stir();
    }else{
      me.miss++; b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); tone(200,.15,'sine',.08);
      mgStatus(added.includes(i)?'Den har du redan lagt i!':'Det står inte på receptet. Titta igen!');
    }
  });
  function stir(){
    const N=5; let n=0;
    $('#mShelf').outerHTML=`<div><div class="dots mgdots">${'<i></i>'.repeat(N)}</div><button class="btn big" id="mStir">🥄 Rör om</button></div>`;
    mgHelp('Bra! Rör om i skålen. Tryck på skeden.');
    $('#mStir').onclick=()=>{
      if(!mgLive(me)) return; n++; mgDots(n);
      const bowl=$('#mBowl'); bowl.classList.remove('stir'); void bowl.offsetWidth; bowl.classList.add('stir');
      tone(400+n*60,.08,'sine',.08);
      if(n>=N){bowl.classList.add('done');$('#mStir').disabled=true;mgWin(me,Math.max(.4,1-.2*me.miss),'Mmm, maten är klar!',`Ge maten till ${d.def.name}`)}
    };
  }
}

/* Vatten: håll inne och släpp i det gröna fältet */
function miniVatten(a,d,me){
  const low=rand(50,66), high=low+15; let lvl=0, pouring=false, last=0, tries=0, spill=false;
  a.innerHTML=`<div class="glasswrap"><div class="jug" id="vJug">🫗</div><div class="wbowl" id="vB"><div class="wband" style="bottom:${low}%;height:${high-low}%"></div><div class="wfill" id="vF"></div></div></div>
    <div class="row" style="justify-content:center"><button class="btn big pour" id="vP">💧 Håll inne och häll</button></div>`;
  mgHelp('Fyll skålen till det gröna fältet. Släpp knappen i tid!');
  const btn=a.querySelector('#vP');
  const start=e=>{e.preventDefault(); if(!mgLive(me)||spill||pouring) return; pouring=true; last=performance.now(); $('#vJug').classList.add('on'); requestAnimationFrame(loop)};
  const stop=()=>{if(!pouring) return; pouring=false; const j=$('#vJug'); if(j) j.classList.remove('on'); check()};
  btn.addEventListener('pointerdown',start); btn.addEventListener('pointerup',stop);
  btn.addEventListener('pointerleave',stop); btn.addEventListener('pointercancel',stop);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  function loop(now){
    if(!pouring||!mgLive(me)) return;
    const dt=Math.min(.05,(now-last)/1000); last=now; lvl+=24*dt;
    $('#vF').style.height=Math.min(100,lvl)+'%';
    if(lvl>=100){stop();return}
    requestAnimationFrame(loop);
  }
  function check(){
    if(!mgLive(me)) return;
    if(lvl>=low&&lvl<=high) mgWin(me,Math.max(.4,1-.2*tries),'Perfekt! Precis lagom med vatten.',`Ge vattnet till ${d.def.name}`);
    else if(lvl<low) mgStatus('Lite till! Håll inne igen.');
    else{
      tries++; spill=true; mgStatus('Oj, det rann över! Vi häller ut och provar igen.');
      $('#vB').classList.add('spill'); tone(200,.2,'sine',.08);
      setTimeout(()=>{if(!mgLive(me)) return; lvl=0; $('#vF').style.height='0%'; $('#vB').classList.remove('spill'); spill=false; mgStatus('Prova igen!')},1200);
    }
  }
}

/* Tvätt: skrubba bort fläckarna och skölj */
function miniTvatt(a,d,me){
  const P0=[[32,40],[58,52],[74,62],[46,72],[64,40],[36,60]];
  const pts=d.dirty?P0:P0.slice(0,3);
  a.innerHTML=`<div class="scrub" id="tS"><div class="scdog">${dogSVG(d.def,d.collar)}</div>${pts.map((p,i)=>`<div class="spot" data-s="${i}" style="left:${p[0]}%;top:${p[1]}%"></div>`).join('')}</div>`;
  mgHelp(d.dirty?'Skrubba bort all lera! Gnugga eller tryck på fläckarna.':'Skrubba pälsen fin! Gnugga eller tryck på fläckarna.');
  const hp=pts.map(()=>3); let left=pts.length, down=false, moves=0;
  const area=a.querySelector('#tS');
  function hit(el){
    if(!mgLive(me)||!el||!el.classList||!el.classList.contains('spot')||el.classList.contains('clean')) return;
    const i=+el.dataset.s; hp[i]--; el.style.opacity=.3+hp[i]*.23; el.style.transform=`scale(${.7+hp[i]*.1})`;
    tone(700+rand(-80,80),.05,'sine',.05);
    if(hp[i]<=0){el.classList.add('clean');el.textContent='🫧';el.style.opacity=1;el.style.transform='';left--;if(left===0) rinse()}
  }
  area.addEventListener('pointerdown',e=>{e.preventDefault();down=true;moves=0;hit(e.target)});
  area.addEventListener('pointermove',e=>{if(!down) return; moves++; if(moves%5===0) hit(document.elementFromPoint(e.clientX,e.clientY))});
  const up=()=>{down=false};
  area.addEventListener('pointerup',up); area.addEventListener('pointerleave',up); area.addEventListener('pointercancel',up);
  function rinse(){
    mgHelp('Fint! Nu ska tvålen sköljas bort.');
    $('#mgRow').insertAdjacentHTML('afterbegin','<button class="btn big" id="tR">🚿 Skölj</button>');
    $('#tR').onclick=()=>{
      if(!mgLive(me)) return; $('#tR').remove(); area.classList.add('rinse'); tone(300,.6,'sine',.06);
      setTimeout(()=>{if(!mgLive(me)) return; area.querySelectorAll('.spot').forEach(s=>s.remove()); mgWin(me,1,`${d.def.name} är skinande ren!`)},1100);
    };
  }
}

/* Lek: kasta bollen när pinnen är vid hunden */
function miniLek(a,d,me){
  const N=3; let round=0, hits=0, pos=0, dir=1, run=false, last=0, zone=null;
  a.innerHTML=`<div class="field"><div class="zone" id="lZ"></div><div class="tdog" id="lD">${dogSVG(d.def,d.collar)}</div><div class="needle" id="lN"></div><div class="tball" id="lB">🎾</div></div>
    <div class="dots mgdots">${'<i></i>'.repeat(N)}</div>
    <div class="row" style="justify-content:center;margin-top:4px"><button class="btn big" id="lT">Kasta 🎾</button></div>`;
  mgHelp(`Tryck på Kasta när den rosa pinnen är vid ${d.def.name}.`);
  const btn=a.querySelector('#lT');
  function newRound(){
    if(!mgLive(me)) return;
    zone={l:rand(26,70),w:22};
    $('#lZ').style.left=zone.l+'%'; $('#lZ').style.width=zone.w+'%';
    $('#lD').style.left=(zone.l+zone.w/2)+'%';
    const b=$('#lB'); b.style.transition='none'; b.style.left='4%'; b.style.top='100px';
    pos=0; dir=1; run=true; btn.disabled=false; last=performance.now(); requestAnimationFrame(loop);
  }
  function loop(now){
    if(!run||!mgLive(me)) return;
    const dt=Math.min(.05,(now-last)/1000); last=now;
    pos+=dir*60*dt; if(pos>100){pos=100;dir=-1} if(pos<0){pos=0;dir=1}
    $('#lN').style.left=pos+'%'; requestAnimationFrame(loop);
  }
  btn.onclick=()=>{
    if(!run||!mgLive(me)) return; run=false; btn.disabled=true;
    const ok=pos>=zone.l&&pos<=zone.l+zone.w;
    const b=$('#lB'); void b.offsetWidth; b.style.transition='left .5s ease-out, top .5s ease-in';
    b.style.left=pos+'%'; b.style.top=ok?'55px':'112px';
    round++;
    setTimeout(()=>{
      if(!mgLive(me)) return;
      if(ok){hits++; const dg=$('#lD'); dg.classList.remove('catch'); void dg.offsetWidth; dg.classList.add('catch'); mgStatus(pick(['Fångad!','Vilken fångst!','Snyggt kast!'])); tone(880,.12,'triangle',.1)}
      else mgStatus(`Bollen hamnade bredvid. ${d.def.name} hämtar den ändå!`);
      mgDots(round);
      if(round>=N) setTimeout(()=>mgWin(me,.4+.2*hits,hits===3?`Tre fångster! ${d.def.name} är jätteglad.`:`${d.def.name} fångade ${hits} av 3. Vad roligt ni hade!`),700);
      else setTimeout(newRound,900);
    },520);
  };
  newRound();
}

/* Vila: klappa lugnt och sakta tills hunden somnar */
function miniVila(a,d,me){
  const N=6, notes=[523,494,440,392,349,330]; let calm=0, last=0, fast=0;
  a.innerHTML=`<div class="nap" id="vN"><div class="ndog">${dogSVG(d.def,d.collar)}</div></div><div class="calm"><i id="vC"></i></div>`;
  mgHelp(`Klappa ${d.def.name} lugnt och sakta. Tryck, vänta lite, tryck igen.`);
  const box=a.querySelector('#vN');
  box.addEventListener('click',e=>{
    if(!mgLive(me)) return;
    const now=performance.now(), r=box.getBoundingClientRect();
    const h=document.createElement('div'); h.className='pat';
    h.style.left=(e.clientX-r.left-13)+'px'; h.style.top=(e.clientY-r.top-13)+'px';
    if(last&&now-last<600){fast++; calm=Math.max(0,calm-1); h.textContent='❗'; mgStatus('Oj, för snabbt! Lugnt och sakta.'); tone(300,.08,'square',.04)}
    else{calm++; h.textContent='💜'; mgStatus(''); tone(notes[Math.min(calm-1,5)],.5,'sine',.08)}
    last=now; box.appendChild(h); setTimeout(()=>h.remove(),1200);
    $('#vC').style.width=(calm/N*100)+'%';
    if(calm>=N){box.classList.add('sleep'); box.insertAdjacentHTML('beforeend','<div class="pat" style="left:62%;top:12%;font-weight:700;color:#22324a">z z z</div>'); mgWin(me,Math.max(.5,1-.1*fast),`${d.def.name} somnade. Sov gott!`)}
  });
}

/* ---------- Bygga ---------- */
function openBuild(after){
  const p=P();
  const c=showModal(`<h2>Bygg ut dagiset</h2><p>Du har <b>${p.stars} ⭐</b>. Stjärnor får du när ägarna hämtar glada hundar.</p>
    <div class="items">${MODULES.map(m=>{const own=hasMod(m.id);return `<div class="item ${own?'own':''}"><div class="ic">${m.icon}</div><b>${m.name}</b><small>${m.desc}</small>
      <button data-mod="${m.id}" ${own||p.stars<m.price?'disabled':''}>${own?'Byggd ✓':'Bygg för '+m.price+' ⭐'}</button></div>`}).join('')}</div>
    <div class="row">${p.modules.length?'<button class="btn ghost" id="bMove">Flytta något</button>':''}<button class="btn" data-close>Klar</button></div>`,{onClose:after});
  c.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{const m=MOD(b.dataset.mod); if(P().stars<m.price) return; startPlace({mode:'new',id:m.id,cost:m.price,after})});
  const mv=c.querySelector('#bMove'); if(mv) mv.onclick=()=>startPlace({mode:'pick',after});
}
function hideModalOnly(){modal.classList.add('hidden');modal.innerHTML='';modalOpt=null;TR=null;AG=null}
function startPlace(opt){
  hideModalOnly(); deselect(); G.paused=true;
  PL={...opt,x:0,y:0,ok:false,idx:null,ghost:null};
  scene.classList.add('building'); $('#buildbar').classList.remove('hidden');
  if(PL.mode==='pick'){$('#bbText').textContent='Tryck på det du vill flytta.';$('#bbOk').classList.add('hidden')}
  else{makeGhost();setGhost((PLOT.x1+PLOT.x2)/2,(PLOT.y1+PLOT.y2)/2)}
}
function makeGhost(){
  const m=MOD(PL.id);
  const g=document.createElement('div'); g.id='ghost'; g.style.width=m.w+'px'; g.style.height=m.h+'px'; g.innerHTML=modSVG(PL.id);
  scene.appendChild(g); PL.ghost=g;
  $('#bbOk').classList.remove('hidden'); $('#bbOk').textContent=PL.mode==='move'?'Flytta hit':'Bygg här';
}
function canPlace(id,x,y,ignore){
  const m=MOD(id), a={x1:x-m.w/2,x2:x+m.w/2,y1:y-m.h/2,y2:y+m.h/2};
  if(a.x1<PLOT.x1-6||a.x2>PLOT.x2+6||a.y1<PLOT.y1-6||a.y2>PLOT.y2+6) return false;
  if(a.x2>870&&a.y1<385&&a.y2>285) return false;
  if(a.x1<640&&a.y1<340&&a.y2>260) return false;
  return P().modules.every((o,i)=>{if(i===ignore) return true; const q=MOD(o.id);
    return a.x2+8<o.x-q.w/2||a.x1-8>o.x+q.w/2||a.y2+8<o.y-q.h/2||a.y1-8>o.y+q.h/2});
}
function setGhost(x,y){
  const m=MOD(PL.id);
  x=Math.round(Math.min(PLOT.x2-m.w/2,Math.max(PLOT.x1+m.w/2,x))/10)*10;
  y=Math.round(Math.min(PLOT.y2-m.h/2,Math.max(PLOT.y1+m.h/2,y))/10)*10;
  PL.x=x; PL.y=y; PL.ok=canPlace(PL.id,x,y,PL.idx);
  PL.ghost.style.left=x+'px'; PL.ghost.style.top=y+'px'; PL.ghost.classList.toggle('bad',!PL.ok);
  $('#bbOk').disabled=!PL.ok;
  $('#bbText').textContent=PL.ok?`Tryck på gården för att välja plats. Tryck sedan på ${PL.mode==='move'?'Flytta hit':'Bygg här'}.`
    :'Det får inte plats här. Tryck på en annan plats på gården.';
}
function scenePt(e){const r=scene.getBoundingClientRect(), s=r.width/W; return {x:(e.clientX-r.left)/s,y:(e.clientY-r.top)/s}}
function placeClick(e){
  if(PL.mode==='pick'){
    const el=e.target.closest('.mod'); if(!el) return;
    const i=+el.dataset.mi, m=P().modules[i];
    PL.mode='move'; PL.idx=i; PL.id=m.id; el.classList.add('lift');
    makeGhost(); setGhost(m.x,m.y); return;
  }
  const pt=scenePt(e); setGhost(pt.x,pt.y);
}
function endPlace(){
  if(!PL) return; const after=PL.after;
  if(PL.ghost) PL.ghost.remove();
  scene.classList.remove('building'); $('#buildbar').classList.add('hidden');
  PL=null; renderMods(); G.paused=false;
  if(after) after();
}
$('#bbOk').onclick=()=>{
  if(!PL||!PL.ok) return; const p=P();
  if(PL.mode==='new'){p.stars-=PL.cost;p.modules.push({id:PL.id,x:PL.x,y:PL.y})}
  else if(PL.mode==='move'){p.modules[PL.idx]={...p.modules[PL.idx],x:PL.x,y:PL.y}}
  persist(); updateHUD(); sHappy(); float(PL.x,PL.y-30,PL.mode==='new'?'Byggt! 🎉':'Flyttat!');
  endPlace();
};
$('#bbCancel').onclick=()=>endPlace();

/* ---------- Agility (minispel) ---------- */
function openAgility(d){
  deselect();
  const HS=[28,54,80];
  showModal(`<div class="train"><h2>Agility med ${esc(d.def.name)}</h2>
    <p>Tryck på <b>Hoppa!</b> när ${esc(d.def.name)} kommer fram till ett hinder.</p>
    <div class="ag-track" id="agT">${HS.map((x,i)=>`<div class="ag-h" data-h="${i}" style="left:${x}%"></div>`).join('')}<div class="ag-flag">🏁</div>
      <div class="ag-dog" id="agD"><div class="agf">${dogSVG(d.def,d.collar)}</div></div></div>
    <div class="status" id="agS">Klara, färdiga …</div>
    <div class="row" style="justify-content:center" id="agRow"><button class="btn ag-jump" id="agJ">Hoppa!</button></div></div>`);
  AG={d,H:HS,pos:4,res:[0,0,0],last:0,phase:'ready'};
  const me=AG;
  $('#agJ').onclick=agJump; $('#agT').onclick=agJump;
  setTimeout(()=>{if(AG!==me) return; AG.phase='run'; $('#agS').textContent='Kör!'; AG.last=performance.now(); requestAnimationFrame(agLoop)},1100);
}
function agLoop(now){
  if(!AG||AG.phase!=='run') return;
  const dt=Math.min(.05,(now-AG.last)/1000); AG.last=now;
  AG.pos+=13*dt;
  AG.H.forEach((h,i)=>{if(AG.res[i]===0&&AG.pos>h+6){AG.res[i]=2;modal.querySelector(`[data-h="${i}"]`).classList.add('down');tone(180,.2,'sine',.08);$('#agS').textContent='Oj, hindret ramlade. Fortsätt!'}});
  const el=$('#agD'); if(el) el.style.left=AG.pos+'%';
  if(AG.pos>=95){agDone();return}
  requestAnimationFrame(agLoop);
}
function agJump(e){
  if(e) e.stopPropagation();
  if(!AG||AG.phase!=='run') return;
  const dog=$('#agD'); dog.classList.remove('jump'); void dog.offsetWidth; dog.classList.add('jump');
  const i=AG.H.findIndex((h,k)=>AG.res[k]===0&&Math.abs(AG.pos-h)<=7);
  if(i>=0){AG.res[i]=1;modal.querySelector(`[data-h="${i}"]`).classList.add('ok');tone(PADS[i].f,.2,'triangle',.12);$('#agS').textContent=pick(['Snyggt hopp!','Hopp!','Bra jobbat!'])}
}
function agDone(){
  const {d,res}=AG; AG.phase='done';
  const n=res.filter(x=>x===1).length, kr=4+3*n;
  $('#agS').textContent=n===3?`Perfekt! ${d.def.name} klarade alla hinder! Du får ${kr} kr.`:`${d.def.name} klarade ${n} av 3 hinder. Du får ${kr} kr.`;
  $('#agRow').innerHTML='<button class="btn" id="agOk">Klar!</button>'; $('#agOk').onclick=closeModal;
  fulfill(d,'agility',n*6); addMoney(kr,d.x,d.y-140); if(n===3) setTimeout(sHappy,200);
}

/* ---------- Start ---------- */
fit();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(tick)});
if(save.current&&save.profiles[save.current]){ensureDogs(P());updateHUD();applyDecor();dayIntro()}
else profileScreen();
</script>
