<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Djurpolisen</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #d1fae5;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #065f46; margin-bottom: 5px; }
        #gameContainer {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        canvas {
            background-color: #4b5563;
            border: 4px solid #1f2937;
            border-radius: 8px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
        }
        #ui {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #111;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .ui-box {
            background-color: #a7f3d0;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #059669;
        }
        select {
            font-size: 16px;
            padding: 2px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            width: 80%;
            max-width: 300px;
            z-index: 10;
        }
        #gameOverScreen h2 {
            margin-top: 0;
            color: #dc2626;
            font-size: 28px;
        }
        #gameOverScreen p {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }
        .restart-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #10b981;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        .restart-btn:hover {
            background-color: #059669;
            transform: scale(1.05);
        }

        /* Pilknappar för surfplatta/mobil */
        body {
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: calc(100vh - 290px);
            max-height: calc(100dvh - 290px);
            min-height: 300px;
        }
        #controls {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 14px;
        }
        .arrow-btn {
            width: 110px;
            height: 80px;
            font-size: 44px;
            font-weight: bold;
            color: white;
            background-color: #1d4ed8;
            border: 4px solid #1f2937;
            border-radius: 18px;
            box-shadow: 0 6px 0 #1f2937;
            cursor: pointer;
            touch-action: none;
        }
        .arrow-btn.down {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1f2937;
            background-color: #1e40af;
        }
    </style>
</head>
<body>

    <h1>🚓 Djurpolisen 🚓</h1>
    
    <div id="ui">
        <div class="ui-box">Sträcka: <span id="scoreDisplay">0</span> m</div>
        <div class="ui-box">Tjuvar: <span id="thiefDisplay">0</span> st</div>
        <div class="ui-box">
            Svårighet:
            <select id="difficultySelect">
                <option value="0.7">Lätt</option>
                <option value="1" selected>Mellan</option>
                <option value="1.5">Svår</option>
            </select>
        </div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="gameOverScreen">
            <h2>Krock!</h2>
            <p>Du råkade köra på ett djur.</p>
            <p>Sträcka: <span id="finalScore">0</span> m</p>
            <p>Fångade tjuvar: <span id="finalThieves">0</span> st</p>
            <button class="restart-btn" onclick="resetGame()">Starta om</button>
        </div>
    </div>

    <div id="controls">
        <button class="arrow-btn" id="btnLeft" aria-label="Styr vänster">◀</button>
        <button class="arrow-btn" id="btnRight" aria-label="Styr höger">▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const difficultySelect = document.getElementById("difficultySelect");
        
        let distance = 0; 
        let thievesCaught = 0; // Ny variabel för tjuv-poäng
        let isGameOver = false;
        let animationId;
        
        let levelMultiplier = 1; 
        let milestonesPassed = 0;
        
        let car = { x: 175, y: 500, width: 50, height: 80, baseSpeed: 6 };
        
        let entities = [];
        let roadMarkers = []; 
        let spawnTimer = 0;

        const thieves = ["🦹‍♂️", "🥷", "🏃‍♂️💰"];
        const animals = ["🐶", "🐱", "🐰", "🐼", "🦊", "🦌"];

        const keys = { ArrowLeft: false, ArrowRight: false };
        window.addEventListener("keydown", (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener("keyup", (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Pilknappar: håll fingret (eller musen) på knappen för att styra
        function bindArrow(id, key) {
            const btn = document.getElementById(id);
            const press = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add("down"); };
            const release = () => { keys[key] = false; btn.classList.remove("down"); };
            btn.addEventListener("pointerdown", press);
            ["pointerup", "pointercancel", "pointerleave"].forEach(t => btn.addEventListener(t, release));
            btn.addEventListener("contextmenu", (e) => e.preventDefault());
        }
        bindArrow("btnLeft", "ArrowLeft");
        bindArrow("btnRight", "ArrowRight");

        function update() {
            if (isGameOver) return;

            let diffMultiplier = parseFloat(difficultySelect.value);
            let currentSpeedFactor = diffMultiplier * levelMultiplier;

            distance += 0.1 * currentSpeedFactor;

            let currentMilestone = Math.floor(distance / 500);
            if (currentMilestone > milestonesPassed) {
                milestonesPassed = currentMilestone;
                levelMultiplier += 0.2; 
                roadMarkers.push({ y: -40, height: 40 });
            }

            let actualCarSpeed = car.baseSpeed * currentSpeedFactor;
            if (keys.ArrowLeft && car.x > 0) car.x -= actualCarSpeed;
            if (keys.ArrowRight && car.x + car.width < canvas.width) car.x += actualCarSpeed;

            spawnTimer++;
            let spawnRate = Math.max(15, (70 / diffMultiplier) - Math.floor(distance / 50)); 
            
            if (spawnTimer > spawnRate) {
                spawnEntity();
                spawnTimer = 0;
            }

            for (let i = roadMarkers.length - 1; i >= 0; i--) {
                let m = roadMarkers[i];
                m.y += 5 * currentSpeedFactor; 
                if (m.y > canvas.height) {
                    roadMarkers.splice(i, 1);
                }
            }

            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                e.y += e.speed * currentSpeedFactor;

                if (checkCollision(car, e)) {
                    if (e.type === "thief") {
                        // Uppdaterar både bonussträcka och antal fångade tjuvar
                        distance += 50;
                        thievesCaught++;
                        entities.splice(i, 1);
                    } else if (e.type === "animal") {
                        triggerGameOver();
                        return; 
                    }
                }
                else if (e.y > canvas.height) {
                    entities.splice(i, 1);
                }
            }

            updateUI();
        }

        function spawnEntity() {
            let isThief = Math.random() < 0.4;
            let emoji = isThief ? thieves[Math.floor(Math.random() * thieves.length)] : animals[Math.floor(Math.random() * animals.length)];
            let type = isThief ? "thief" : "animal";
            let size = 40;
            
            // Standard: Slumpmässig position över HELA bredden (förhindrar kant-fusk)
            let spawnX = Math.random() * (canvas.width - size);

            // Smartsikte: 20% chans att figuren siktar direkt där polisbilen är just nu
            if (Math.random() < 0.20) {
                spawnX = car.x + (car.width / 2) - (size / 2);
                // Se till att figuren inte hamnar utanför skärmen om bilen är exakt vid kanten
                spawnX = Math.max(0, Math.min(canvas.width - size, spawnX));
            }

            entities.push({
                emoji: emoji,
                type: type,
                x: spawnX,
                y: -50,
                width: size,
                height: size,
                speed: isThief ? 4 + Math.random() * 2 : 3 + Math.random() * 1.5 
            });
        }

        function checkCollision(rect1, rect2) {
            let hitboxPadding = 10; 
            return (
                rect1.x < rect2.x + rect2.width - hitboxPadding &&
                rect1.x + rect1.width > rect2.x + hitboxPadding &&
                rect1.y < rect2.y + rect2.height - hitboxPadding &&
                rect1.y + rect1.height > rect2.y + hitboxPadding
            );
        }

        function draw() {
            ctx.fillStyle = "#4b5563";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#9ca3af";
            for(let i = 0; i < canvas.height; i += 60) {
                let offset = (distance * 20) % 60; 
                ctx.fillRect(canvas.width / 2 - 5, i + offset - 60, 10, 30);
            }

            for (let m of roadMarkers) {
                ctx.fillStyle = "#facc15"; 
                ctx.fillRect(0, m.y, canvas.width, m.height);
                
                ctx.fillStyle = "#000000";
                ctx.font = "bold 20px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("HASTIGHET ÖKAR!", canvas.width / 2, m.y + m.height / 2);
            }

            ctx.fillStyle = "#1d4ed8"; 
            ctx.fillRect(car.x, car.y, car.width, car.height);
            ctx.fillStyle = "#ffffff"; 
            ctx.fillRect(car.x + 10, car.y, 30, car.height);
            ctx.fillStyle = "#111827"; 
            ctx.fillRect(car.x + 5, car.y + 15, car.width - 10, 20);
            ctx.fillStyle = "#ef4444"; 
            ctx.fillRect(car.x + 10, car.y + 5, 10, 5);
            ctx.fillStyle = "#3b82f6"; 
            ctx.fillRect(car.x + 30, car.y + 5, 10, 5);

            ctx.font = "35px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            for (let e of entities) {
                ctx.fillText(e.emoji, e.x + e.width/2, e.y + e.height/2);
            }
        }

        function gameLoop() {
            if (!isGameOver) {
                update();
                draw();
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function updateUI() {
            document.getElementById("scoreDisplay").innerText = Math.floor(distance);
            document.getElementById("thiefDisplay").innerText = thievesCaught;
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById("gameOverScreen").style.display = "block";
            document.getElementById("finalScore").innerText = Math.floor(distance);
            document.getElementById("finalThieves").innerText = thievesCaught;
            difficultySelect.disabled = false; 
        }

        function resetGame() {
            distance = 0;
            thievesCaught = 0;
            isGameOver = false;
            entities = [];
            roadMarkers = [];
            milestonesPassed = 0;
            levelMultiplier = 1;
            car.x = 175; 
            
            document.getElementById("gameOverScreen").style.display = "none";
            difficultySelect.disabled = true; 
            
            updateUI();
            gameLoop(); 
        }

        difficultySelect.disabled = true; 
        updateUI();
        gameLoop();

    </script>
</body>
</html>
